<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrati • BarberApp</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="vender/bootstrap/css/bootstrap.min.css">

    <!-- Custom -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Icons Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Config -->
    <script src="/js/config.js" defer></script>
    <!-- Auth Logic -->
    <script src="/js/auth.js" defer></script>
</head>

<body class="bg-light">

    <div class="auth-container">

        <!-- Back Button -->
        <div class="mb-4">
            <a href="login.html" class="btn back-btn">
                <i class="bi bi-arrow-left"></i>
            </a>
        </div>

        <!-- Logo -->
        <div class="text-center mb-4">
            <div class="app-logo mb-3">
                <i class="bi bi-scissors" style="font-size: 48px;"></i>
            </div>
            <h4 class="fw-bold text-primary-color">Crea un account</h4>
            <p class="text-muted">Registrati per iniziare</p>
        </div>

        <!-- ALERT AREA -->
        <div id="alertBox"></div>

        <!-- Register Form -->
        <div class="auth-form">

            <div class="mb-3">
                <label class="form-label">Nome</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0">
                        <i class="bi bi-person text-muted"></i>
                    </span>
                    <input type="text" class="form-control border-start-0" id="name" placeholder="Inserisci il nome">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Cognome</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0">
                        <i class="bi bi-person text-muted"></i>
                    </span>
                    <input type="text" class="form-control border-start-0" id="surname" placeholder="Inserisci il cognome">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0">
                        <i class="bi bi-envelope text-muted"></i>
                    </span>
                    <input type="email" class="form-control border-start-0" id="email" placeholder="Inserisci la tua email">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Telefono</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0">
                        <i class="bi bi-telephone text-muted"></i>
                    </span>
                    <input type="tel" class="form-control border-start-0" id="phone" placeholder="Inserisci il numero di telefono">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0">
                        <i class="bi bi-lock text-muted"></i>
                    </span>

                    <input type="password" 
                        class="form-control border-start-0 border-end-0" 
                        id="password" 
                        placeholder="Crea una password">

                    <span class="input-group-text bg-transparent" 
                        style="cursor:pointer;"
                        onclick="togglePassword('password', 'toggleRegisterPass')">
                        <i id="toggleRegisterPass" class="bi bi-eye text-muted"></i>
                    </span>
                </div>
            </div>


            <div class="d-grid gap-2 mb-4">
                <button class="btn btn-app" onclick="submitRegister()">Crea Account</button>
            </div>

            <div class="text-center">
                <p class="mb-0">Hai già un account?
                    <a href="login.html" class="text-primary-color text-decoration-none">Accedi</a>
                </p>
            </div>

        </div>
    </div>

    <!-- Bootstrap -->
    <script src="vender/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script>
    function togglePassword(id, iconId) {
        const input = document.getElementById(id);
        const icon = document.getElementById(iconId);

        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("bi-eye");
            icon.classList.add("bi-eye-slash");
        } else {
            input.type = "password";
            icon.classList.remove("bi-eye-slash");
            icon.classList.add("bi-eye");
        }
    }
    </script>


</body>

</html>
