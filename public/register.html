<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Registrati - Giovanni Cerino</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="vender/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app-ui.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <meta name="theme-color" content="#09090b">
    <meta name="color-scheme" content="dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Giovanni Cerino">
    <style>
        :root {
            --auth-bg: #080808;
            --auth-field: rgba(55, 61, 72, 0.78);
            --auth-muted: rgba(255, 255, 255, 0.62);
            --auth-gold: #d5a13d;
            --auth-gold-light: #f0cd6d;
        }

        body.auth-page,
        body.auth-page input,
        body.auth-page button,
        body.auth-page a {
            font-family: "Poppins", Arial, sans-serif !important;
        }

        body.auth-page {
            min-height: 100vh;
            margin: 0;
            background: var(--auth-bg);
            color: #fff;
        }

        .auth-screen {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            background:
                linear-gradient(180deg, rgba(0, 0, 0, 0.46), #080808 48%),
                url("/images/bg-login.jpg") top center / cover no-repeat fixed;
        }

        .auth-shell {
            width: min(100%, 480px);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
        }

        .back-row {
            margin-top: 6px;
        }

        .back-btn {
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            background: transparent;
            color: #fff;
            font-size: 28px;
            text-decoration: none;
        }

        .auth-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 22px;
            padding: 26px 0 10px;
        }

        .auth-title h1 {
            margin: 0;
            font-size: clamp(36px, 9vw, 48px);
            line-height: 1.02;
            font-weight: 600;
            letter-spacing: 0;
            color: #fff;
        }

        .auth-title p {
            margin: 10px 0 0;
            color: var(--auth-muted);
            font-size: 16px;
            font-weight: 650;
        }

        .auth-form {
            display: grid;
            gap: 14px;
        }

        .auth-field {
            position: relative;
            min-height: 66px;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: var(--auth-field);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 12px 26px rgba(0, 0, 0, 0.24);
        }

        .field-icon {
            position: absolute;
            left: 22px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.58);
            font-size: 18px;
            pointer-events: none;
            z-index: 2;
        }

        .auth-field input {
            position: relative;
            z-index: 1;
            width: 100%;
            min-width: 0;
            min-height: 64px;
            border: 0;
            outline: 0;
            background: transparent;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            line-height: 1.5;
            padding: 0 26px 0 58px;
        }

        .auth-field.has-toggle input {
            padding-right: 58px;
        }

        .auth-field input::placeholder {
            color: rgba(255, 255, 255, 0.58);
        }

        .auth-field input:-webkit-autofill,
        .auth-field input:-webkit-autofill:hover,
        .auth-field input:-webkit-autofill:focus,
        .auth-field input:-webkit-autofill:active {
            font-family: "Poppins", Arial, sans-serif !important;
            font-size: 16px !important;
            font-weight: 600 !important;
            line-height: 1.5 !important;
            -webkit-text-fill-color: #fff !important;
            caret-color: #fff;
            -webkit-box-shadow: 0 0 0 1000px #3b404a inset !important;
            box-shadow: 0 0 0 1000px #3b404a inset !important;
            transition: background-color 9999s ease-out 0s;
        }

        .auth-field input:-webkit-autofill::first-line {
            font-family: "Poppins", Arial, sans-serif !important;
            font-size: 16px !important;
            font-weight: 600 !important;
        }

        .toggle-pass {
            width: 42px;
            height: 42px;
            border: 0;
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            position: absolute;
            right: 9px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 3;
        }

        .auth-submit {
            min-height: 66px;
            margin-top: 10px;
            border: 0;
            background: linear-gradient(135deg, var(--auth-gold), var(--auth-gold-light));
            color: #17100a;
            font-size: 18px;
            font-weight: 600;
            box-shadow: 0 20px 44px rgba(213, 161, 61, 0.24);
        }

        .terms-copy,
        .auth-link {
            text-align: center;
            color: rgba(255, 255, 255, 0.78);
            font-size: 15px;
            line-height: 1.35;
            font-weight: 650;
        }

        .auth-link {
            font-size: 17px;
            font-weight: 800;
        }

        .auth-link a {
            color: var(--auth-gold-light);
            text-decoration: none;
        }

        #alertBox .alert {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0;
            font-weight: 700;
        }
    </style>
    <style>
        :root {
            --auth-bg: #070707;
            --auth-panel: rgba(10, 10, 10, 0.96);
            --auth-field: rgba(24, 25, 28, 0.88);
            --auth-line: rgba(150, 153, 160, 0.2);
            --auth-muted: #9b9b9f;
            --auth-gold: #d99d2d;
            --auth-gold-light: #f1c863;
        }

        body.auth-page {
            min-height: 100svh;
            background: var(--auth-bg);
        }

        .auth-screen {
            min-height: 100svh;
            padding: 0;
            background: #050505;
        }

        .auth-shell {
            width: min(100%, 480px);
            min-width: 0;
            min-height: 100svh;
            padding: 0;
            overflow-x: hidden;
            background: #080808;
            box-shadow: 0 0 80px rgba(0, 0, 0, 0.65);
        }

        .auth-hero {
            position: relative;
            z-index: 0;
            height: clamp(290px, 38svh, 620px);
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(28px + env(safe-area-inset-top, 0px)) 24px 18px;
            overflow: hidden;
            background: url("/images/bg-login.jpg") center 38% / cover no-repeat;
        }

        .auth-hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(0, 0, 0, 0.44) 0%, rgba(0, 0, 0, 0.31) 45%, rgba(0, 0, 0, 0.76) 100%),
                linear-gradient(90deg, rgba(0, 0, 0, 0.2), transparent 45%, rgba(0, 0, 0, 0.2));
        }

        .auth-panel {
            position: relative;
            z-index: 2;
            flex: 1;
            min-width: 0;
            margin-top: -1px;
            padding: 34px 34px calc(42px + env(safe-area-inset-bottom, 0px));
            border-radius: 46px 46px 0 0;
            background:
                radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.045), transparent 32%),
                var(--auth-panel);
            box-shadow: 0 -22px 58px rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }

        .back-row {
            position: absolute;
            z-index: 3;
            top: calc(18px + env(safe-area-inset-top, 0px));
            left: 18px;
            margin: 0;
        }

        .back-btn {
            color: rgba(255, 255, 255, 0.9);
            font-size: 25px;
        }

        .auth-title {
            position: relative;
            z-index: 1;
            text-align: center;
            transform: translateY(20px);
        }

        .auth-title h1 {
            font-size: clamp(37px, 10vw, 52px);
            line-height: 1.05;
            font-weight: 600;
            text-shadow: 0 5px 28px rgba(0, 0, 0, 0.54);
        }

        .auth-title p {
            margin-top: 16px;
            color: rgba(232, 232, 232, 0.72);
            font-size: 17px;
            font-weight: 400;
        }

        .auth-form {
            gap: 22px;
        }

        .auth-group {
            display: grid;
            gap: 10px;
        }

        .auth-label {
            margin: 0 0 0 8px;
            color: rgba(255, 255, 255, 0.92);
            font-size: 15px;
            font-weight: 500;
        }

        .auth-field {
            min-height: 62px;
            margin: 0;
            overflow: hidden;
            border: 1.5px solid var(--auth-line);
            border-radius: 17px;
            background: var(--auth-field);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.025);
            transition: border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
        }

        .auth-field:focus-within {
            border-color: rgba(229, 174, 65, 0.72);
            background: rgba(28, 29, 32, 0.94);
            box-shadow: 0 0 0 3px rgba(217, 157, 45, 0.1);
        }

        .field-icon {
            left: 20px;
            color: rgba(187, 189, 194, 0.72);
            font-size: 22px;
        }

        .auth-field input {
            min-height: 60px;
            padding: 0 22px 0 62px;
            font-size: 16px;
            font-weight: 400;
        }

        .auth-field input::placeholder {
            color: rgba(170, 171, 176, 0.62);
            opacity: 1;
        }

        .auth-field input:-webkit-autofill,
        .auth-field input:-webkit-autofill:hover,
        .auth-field input:-webkit-autofill:focus,
        .auth-field input:-webkit-autofill:active {
            font-size: 16px !important;
            font-weight: 400 !important;
            -webkit-box-shadow: 0 0 0 1000px #1c1d20 inset !important;
            box-shadow: 0 0 0 1000px #1c1d20 inset !important;
        }

        .auth-field input:-webkit-autofill::first-line {
            font-size: 16px !important;
            font-weight: 400 !important;
        }

        .toggle-pass {
            width: 44px;
            height: 44px;
            right: 10px;
            color: rgba(190, 192, 197, 0.72);
        }

        .auth-submit {
            min-height: 72px;
            margin-top: 4px;
            border: 1px solid #efbd50;
            border-radius: 16px;
            background: linear-gradient(105deg, #d99d2d 0%, #f0c760 54%, #e3ad3e 100%);
            color: #0c0a07;
            font-size: 20px;
            font-weight: 600;
            box-shadow: 0 16px 38px rgba(217, 157, 45, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.32);
            transition: transform 150ms ease, filter 150ms ease;
        }

        .auth-submit:active {
            transform: scale(0.985);
            filter: brightness(0.96);
        }

        .terms-copy {
            margin: 24px 4px 0;
            color: rgba(255, 255, 255, 0.66);
            font-size: 13px;
            line-height: 1.55;
            font-weight: 400;
        }

        .auth-link {
            margin-top: 28px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 15px;
            font-weight: 400;
        }

        #alertBox .alert {
            margin: 0 0 20px;
            border-radius: 14px;
            font-weight: 600;
        }

        @media (max-width: 430px) {
            .auth-panel {
                padding-inline: 24px;
            }

            .auth-title h1 {
                font-size: 36px;
            }

            .auth-title p {
                font-size: 15px;
            }
        }

        @media (max-width: 370px) {
            .auth-panel {
                padding-inline: 22px;
                border-radius: 38px 38px 0 0;
            }
        }

        @media (min-width: 700px) {
            .auth-shell {
                width: min(100%, 520px);
            }
        }
    </style>
    <script src="/js/app-ui.js" defer></script>
    <script src="/js/config.js" defer></script>
    <script src="/js/auth.js" defer></script>
</head>

<body class="auth-page">
    <main class="auth-screen">
        <section class="auth-shell">
            <header class="auth-hero">
                <div class="back-row">
                    <a href="index.html" class="back-btn" aria-label="Torna al login">
                        <i class="bi bi-arrow-left"></i>
                    </a>
                </div>
                <div class="auth-title">
                    <h1>Crea un account</h1>
                    <p>Inserisci i tuoi dati per registrarti</p>
                </div>
            </header>

            <div class="auth-panel">
                <div id="alertBox"></div>

                <div class="auth-form">
                    <div class="auth-group">
                        <label class="auth-label" for="name">Nome</label>
                        <div class="auth-field">
                            <i class="bi bi-person field-icon" aria-hidden="true"></i>
                            <input type="text" id="name" placeholder="Inserisci il tuo nome" autocomplete="given-name">
                        </div>
                    </div>

                    <div class="auth-group">
                        <label class="auth-label" for="surname">Cognome</label>
                        <div class="auth-field">
                            <i class="bi bi-person-badge field-icon" aria-hidden="true"></i>
                            <input type="text" id="surname" placeholder="Inserisci il tuo cognome" autocomplete="family-name">
                        </div>
                    </div>

                    <div class="auth-group">
                        <label class="auth-label" for="email">Email</label>
                        <div class="auth-field">
                            <i class="bi bi-envelope field-icon" aria-hidden="true"></i>
                            <input type="email" id="email" placeholder="Inserisci la tua email" autocomplete="email">
                        </div>
                    </div>

                    <div class="auth-group">
                        <label class="auth-label" for="phone">Numero di telefono</label>
                        <div class="auth-field">
                            <i class="bi bi-telephone field-icon" aria-hidden="true"></i>
                            <input type="tel" id="phone" placeholder="Inserisci il tuo numero" autocomplete="tel">
                        </div>
                    </div>

                    <div class="auth-group">
                        <label class="auth-label" for="password">Password</label>
                        <div class="auth-field has-toggle">
                            <i class="bi bi-lock field-icon" aria-hidden="true"></i>
                            <input type="password" id="password" placeholder="Crea una password" autocomplete="new-password">
                            <button type="button" class="toggle-pass" onclick="togglePassword('password', 'toggleRegisterPass')" aria-label="Mostra password">
                                <i id="toggleRegisterPass" class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button id="submitBtn" class="auth-submit" onclick="submitRegister()">Registrati</button>
                </div>

                <p class="terms-copy">
                    Continuando accetti la gestione del tuo account e del programma fidelity.
                </p>

                <div class="auth-link">
                    Hai già un account? <a href="index.html">Accedi</a>
                </div>
            </div>
        </section>
    </main>

    <script src="vender/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword(id, iconId) {
            const input = document.getElementById(id);
            const icon = document.getElementById(iconId);

            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("bi-eye");
                icon.classList.add("bi-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("bi-eye-slash");
                icon.classList.add("bi-eye");
            }
        }

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/service-worker.js").catch(() => null);
        }
    </script>
</body>

</html>
