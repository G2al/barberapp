<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Accedi • Aletta Barber</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="vender/bootstrap/css/bootstrap.min.css">

    <!-- Custom -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Icons Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BarberApp">

    <!-- Config -->
    <script src="/js/config.js" defer></script>
    <!-- Auth Logic -->
    <script src="/js/auth.js" defer></script>
</head>

<body class="bg-light" style="
    background-color: #1d1d1d !important;
">


    <div class="auth-container">

        <!-- Logo -->
        <div class="text-center mb-4">
            <div class="mb-3">
                <img src="/images/logo-white-aletta.png" alt="BarberApp" class="app-logo-img">
            </div>
           <h4 class="fw-bold text-primary-color" style="
    color: white!important;
">Aletta Barber</h4>
            <p class="text-muted" style="
    color: white!important;
">Accedi al tuo account</p>
        </div>

        <!-- ALERT AREA -->
        <div id="alertBox"></div>

        <!-- Form -->
        <div class="auth-form">

            <!-- EMAIL -->
            <div class="mb-3">
                <label class="form-label">Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0">
                        <i class="bi bi-envelope text-muted"></i>
                    </span>
                    <input type="email" class="form-control border-start-0" id="email" placeholder="Inserisci la tua email">
                </div>
            </div>

            <!-- PASSWORD -->
            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0">
                        <i class="bi bi-lock text-muted"></i>
                    </span>

                    <input type="password" 
                        class="form-control border-start-0 border-end-0" 
                        id="password" 
                        placeholder="Inserisci la password">

                    <span class="input-group-text bg-transparent" 
                        style="cursor:pointer;"
                        onclick="togglePassword('password', 'toggleLoginPass')">
                        <i id="toggleLoginPass" class="bi bi-eye text-muted"></i>
                    </span>
                </div>
            </div>


            <!-- LOGIN BUTTON -->
            <div class="d-grid gap-2 mb-4">
                <button id="submitBtn" class="btn btn-app" onclick="submitLogin()">Accedi</button>
            </div>

            <!-- SIGN UP LINK -->
            <div class="text-center">
                <p class="mb-0" style="color: white!important;">Non hai un account?
                    <a href="register.html" class="text-primary-color text-decoration-none" style="
    color: #f4dda0!important;
">Registrati</a>
                </p>
            </div>

        </div>

        <!-- PWA Installation Guide (solo quando accedi via URL) -->
        <div id="pwaGuide" class="pwa-guide-simple mt-5">
            <div class="pwa-guide-title-simple">
                <i class="bi bi-download"></i>
                <span>Aggiungi l'App</span>
            </div>

            <div class="pwa-steps-simple">
                <!-- Step 1 -->
                <div class="pwa-step-simple">
                    <div class="step-num">1</div>
                    <div class="step-info">
                        <div class="step-text">Clicca il pulsante Condividi</div>
                        <img src="/images/1.jpeg" alt="Step 1" class="step-img">
                    </div>
                </div>

                <!-- Step 2 -->
                <div class="pwa-step-simple">
                    <div class="step-num">2</div>
                    <div class="step-info">
                        <div class="step-text">Seleziona "Aggiungi alla schermata Home"</div>
                        <img src="/images/2.jpeg" alt="Step 2" class="step-img">
                    </div>
                </div>

                <!-- Step 3 -->
                <div class="pwa-step-simple">
                    <div class="step-num">3</div>
                    <div class="step-info">
                        <div class="step-text">Clicca il bottone "Aggiungi"</div>
                        <img src="/images/3.jpeg" alt="Step 3" class="step-img">
                    </div>
                </div>

                <!-- Step 4 -->
                <div class="pwa-step-simple">
                    <div class="step-num">✓</div>
                    <div class="step-info">
                        <div class="step-text">L'app è sulla tua Home Screen!</div>
                        <img src="/images/4.jpeg" alt="Step 4" class="step-img">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap -->
    <script src="vender/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script>
    function togglePassword(id, iconId) {
        const input = document.getElementById(id);
        const icon = document.getElementById(iconId);

        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("bi-eye");
            icon.classList.add("bi-eye-slash");
        } else {
            input.type = "password";
            icon.classList.remove("bi-eye-slash");
            icon.classList.add("bi-eye");
        }
    }

    // Mostra la guida PWA solo se accedi via URL (non dalla PWA installata)
    function checkPWAMode() {
        const pwaGuide = document.getElementById('pwaGuide');

        // Se l'app è in modalità PWA (standalone), nascondi la guida
        if (window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches) {
            pwaGuide.style.display = 'none';
        } else {
            // Se accedi via browser URL, mostra la guida
            pwaGuide.style.display = 'block';
        }
    }

    // Verifica al caricamento della pagina
    checkPWAMode();

    // Registra il Service Worker per PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/js/service-worker.js').then((registration) => {
            console.log('Service Worker registrato:', registration);
        }).catch((error) => {
            console.log('Service Worker registrazione fallita:', error);
        });
    }
    </script>


</body>

</html>
