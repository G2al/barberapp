<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Prenota • Aletta Barber</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="vender/bootstrap/css/bootstrap.min.css">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <!-- Custom -->
  <link rel="stylesheet" href="css/style.css">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aletta Barber">
</head>

<body class="bg-light">

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="d-flex align-items-center mb-3">
        <div class="user-avatar me-3">
          <i class="bi bi-person"></i>
        </div>
        <div>
          <h6 id="usernameDisplay" class="mb-1">Utente</h6>
          <p class="mb-0 small">Cliente Aletta Barber</p>
        </div>
      </div>

      <div class="mt-3">
        <button class="btn btn-danger w-100 rounded-3" onclick="logout()">
          <i class="bi bi-box-arrow-right me-2"></i> Logout
        </button>
      </div>
    </div>
  </div>

  <!-- Overlay -->
  <div class="overlay" id="overlay"></div>

  <!-- Header -->
  <div class="app-header d-flex justify-content-between align-items-center">
    <h5 class="fw-bold text-white">Prenota</h5>

    <div class="d-flex gap-2">
      <button class="btn header-btn" onclick="refreshApp()" title="Aggiorna">
        <i class="bi bi-arrow-clockwise icon-md"></i>
      </button>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="content-area">
    <!-- Welcome Message -->
    <div class="ms-2 me-2 mt-3 mb-3">
      <h5 class="fw-bold text-primary-color">Benvenuto, <span id="welcomeName">Utente</span>! 👋</h5>
      <p class="text-muted small">Seleziona un servizio e prenota il tuo turno</p>
    </div>

    <!-- Alert -->
    <div id="alertBox" class="ms-2 me-2"></div>

    <div class="search-card mb-3" id="pushNotificationCard" hidden>
      <div class="d-flex align-items-start gap-3">
        <div class="fs-3 text-primary-color">
          <i class="bi bi-bell"></i>
        </div>
        <div class="flex-grow-1">
          <h6 class="fw-bold mb-1">Notifiche appuntamenti</h6>
          <p class="text-muted small mb-3" id="pushNotificationStatus">
            Verifica disponibilità delle notifiche...
          </p>
          <div class="d-flex flex-wrap gap-2">
            <button type="button" class="btn btn-app" id="pushNotificationToggle">
              <i class="bi bi-bell me-2"></i>Attiva notifiche
            </button>
            <button type="button" class="btn btn-outline-secondary" id="pushNotificationTest" hidden>
              Invia prova
            </button>
          </div>
        </div>
      </div>
    </div>

    <h5 class="fw-bold text-primary-color mt-3 mb-3 ms-2">Prenota un servizio</h5>

    <div class="search-card">

      <!-- Servizio -->
      <div class="mb-3">
        <label class="form-label fw-bold">
          <i class="bi bi-scissors me-1 text-primary-color"></i>Servizio
        </label>
        <select class="form-select" id="serviceSelect">
          <option value="">Seleziona servizio</option>
        </select>
      </div>

      <!-- Barbiere -->
      <div class="mb-3">
        <label class="form-label fw-bold">
          <i class="bi bi-person-workspace me-1 text-secondary-color"></i>Barbiere
        </label>
        <div class="d-flex align-items-center gap-2">
          <div id="barberAvatar" class="rounded-circle bg-light border" style="width:48px;height:48px;overflow:hidden;display:none;">
            <img id="barberAvatarImg" src="" alt="Avatar" style="width:48px;height:48px;object-fit:cover;">
          </div>
          <select class="form-select" id="barberSelect">
          <option value="">Seleziona barbiere</option>
        </select>
        </div>
      </div>

      <!-- Data -->
      <div class="mb-3">
        <label class="form-label fw-bold">
          <i class="bi bi-calendar3 me-1 text-accent-color"></i>Data
        </label>
        <input type="date" class="form-control" id="dateSelect" min="">
      </div>

      <!-- Ora -->
      <div class="mb-3">
        <label class="form-label fw-bold">
          <i class="bi bi-clock me-1 text-warning"></i>Ora
        </label>
        <select class="form-select" id="timeSelect">
          <option value="">Seleziona ora</option>
        </select>
      </div>

      <button id="confirmBtn" class="btn-app btn w-100 fw-bold p-2 mt-2" onclick="confirmBooking()">
        <i class="bi bi-check-circle me-2"></i>Conferma Prenotazione
      </button>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <a class="nav-item active">
      <i class="bi bi-calendar-check"></i>
      <span>Prenota</span>
    </a>
    <a href="my-bookings.html" class="nav-item">
      <i class="bi bi-journal-text"></i>
      <span>Le mie prenotazioni</span>
    </a>
    <a href="products.html" class="nav-item">
      <i class="bi bi-box"></i>
      <span>Prodotti</span>
    </a>
    <a href="#" class="nav-item" onclick="logout()">
      <i class="bi bi-box-arrow-right"></i>
      <span>Logout</span>
    </a>
  </div>

  <!-- Bootstrap -->
  <script src="vender/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
  <script src="/js/config.js" defer></script>
  <script src="/js/auth.js" defer></script>
  <script src="/js/dashboard.js" defer></script>
  <script src="/js/push-notifications.js" defer></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js', {
        updateViaCache: 'none'
      }).then((registration) => {
        console.log('Service Worker registrato:', registration);
        registration.update();
      }).catch((error) => {
        console.log('Service Worker registrazione fallita:', error);
      });
    }

    // Update welcome message with user name
    document.addEventListener('DOMContentLoaded', function() {
      const user = getUser();
      if (user && user.name) {
        document.getElementById('welcomeName').textContent = user.name;
      }
    });
  </script>
</body>
</html>
