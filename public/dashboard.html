<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Prenota - Giovanni Cerino</title>

  <link rel="stylesheet" href="vender/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root {
      --gc-bg: #090909;
      --gc-panel: rgba(27, 27, 27, 0.82);
      --gc-panel-strong: rgba(35, 35, 35, 0.94);
      --gc-line: rgba(255, 255, 255, 0.09);
      --gc-muted: rgba(255, 255, 255, 0.62);
      --gc-gold: #d5a13d;
      --gc-gold-light: #f0cd6d;
      --gc-gold-dark: #9f7222;
    }

    body.booking-page {
      min-height: 100vh;
      margin: 0;
      padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px));
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.32), rgba(0, 0, 0, 0.96) 310px),
        url("/images/bg-login.jpg") top center / cover fixed no-repeat,
        #090909;
      color: #fff;
      font-family: "Karla", Arial, sans-serif;
    }

    .gc-header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: calc(16px + env(safe-area-inset-top, 0px)) 18px 16px;
      background: rgba(9, 9, 9, 0.82);
      border-bottom: 1px solid var(--gc-line);
      backdrop-filter: blur(18px);
    }

    .gc-header-title {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-size: 20px;
      font-weight: 900;
    }

    .gc-header-title i,
    .gc-action-btn {
      color: var(--gc-gold-light);
    }

    .gc-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .gc-action-btn {
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      text-decoration: none;
      padding: 0;
    }

    .profile-portrait {
      display: none;
      position: absolute;
      right: 22px;
      top: 16px;
      z-index: 8;
      width: 92px;
      aspect-ratio: 1;
      border-radius: 50%;
      overflow: hidden;
      background: #f1f1f1;
      box-shadow: 0 22px 44px rgba(0, 0, 0, 0.42);
    }

    .profile-portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .booking-shell {
      position: relative;
      z-index: 4;
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 34px 14px 0;
    }

    #alertBox {
      margin-bottom: 12px;
    }

    .booking-card {
      position: relative;
      padding: 94px 20px 22px;
      border-radius: 22px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.035)),
        rgba(18, 18, 18, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.48);
      backdrop-filter: blur(18px);
    }

    .booking-step {
      margin-bottom: 20px;
    }

    .step-label {
      margin: 0 0 11px;
      color: #fff;
      font-size: 15px;
      line-height: 1.2;
      font-weight: 900;
      text-transform: uppercase;
    }

    .step-label span {
      color: var(--gc-gold-light);
    }

    .premium-select-card {
      display: grid;
      grid-template-columns: 54px 1fr 24px;
      align-items: center;
      gap: 12px;
      min-height: 76px;
      padding: 8px 12px 8px 8px;
      border-radius: 17px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }

    .premium-select-card select {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
      z-index: 3;
    }

    .select-icon,
    .barber-avatar-large {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background:
        linear-gradient(145deg, rgba(213, 161, 61, 0.18), rgba(213, 161, 61, 0.05)),
        rgba(255, 255, 255, 0.04);
      color: var(--gc-gold-light);
      overflow: hidden;
    }

    .select-icon i {
      font-size: 25px;
    }

    .barber-avatar-large {
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
    }

    .barber-avatar-large img {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .barber-avatar-large.has-image img {
      display: block;
    }

    .barber-avatar-large:not(.has-image)::before {
      content: "GC";
      color: #111;
      font-weight: 900;
    }

    .select-copy strong {
      display: block;
      color: #fff;
      font-size: 17px;
      line-height: 1.2;
      font-weight: 900;
    }

    .select-copy span {
      display: block;
      margin-top: 5px;
      color: rgba(255, 255, 255, 0.66);
      font-size: 13px;
      line-height: 1.25;
    }

    .select-chevron {
      color: #fff;
      font-size: 23px;
      z-index: 1;
    }

    .native-date {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .month-control {
      margin-bottom: 12px;
    }

    .month-control select {
      width: 100%;
      height: 70px;
      min-height: 70px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.055);
      color: #fff;
      padding: 0 24px;
      font-size: 21px;
      font-weight: 800;
      outline: none;
    }

    .month-control option {
      color: #111;
    }

    .date-strip {
      display: grid;
      grid-template-columns: repeat(7, minmax(58px, 1fr));
      gap: 9px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .date-strip::-webkit-scrollbar {
      display: none;
    }

    .date-pill {
      min-width: 58px;
      min-height: 70px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.045);
      color: #fff;
      text-align: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .date-pill strong {
      display: block;
      font-size: 22px;
      line-height: 1;
      font-weight: 900;
    }

    .date-pill span {
      display: block;
      margin-top: 7px;
      color: rgba(255, 255, 255, 0.68);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .date-pill.active {
      border-color: rgba(255, 255, 255, 0.14);
      background: linear-gradient(135deg, var(--gc-gold), var(--gc-gold-light));
      color: #fff;
      box-shadow: 0 15px 34px rgba(213, 161, 61, 0.24);
    }

    .date-pill.active span {
      color: rgba(255, 255, 255, 0.86);
    }

    #timeSelect {
      display: none;
    }

    .time-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .time-slot {
      min-height: 48px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.045);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .time-slot.active {
      background: linear-gradient(135deg, var(--gc-gold), var(--gc-gold-light));
      border-color: rgba(255, 255, 255, 0.14);
      box-shadow: 0 16px 36px rgba(213, 161, 61, 0.24);
    }

    .time-empty {
      grid-column: 1 / -1;
      margin: 0;
      padding: 15px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.045);
      color: rgba(255, 255, 255, 0.68);
      text-align: center;
    }

    .confirm-booking-btn {
      min-height: 60px;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(135deg, var(--gc-gold), var(--gc-gold-light));
      color: #fff;
      font-size: 15px;
      font-weight: 900;
      text-transform: uppercase;
      box-shadow: 0 18px 40px rgba(213, 161, 61, 0.28);
    }

    .confirm-booking-btn i {
      font-size: 24px;
    }

    .bottom-nav {
      position: fixed;
      left: 18px;
      right: 18px;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      z-index: 50;
      height: 72px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      max-width: 760px;
      margin: 0 auto;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.035)),
        rgba(22, 22, 22, 0.92);
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(18px);
    }

    .bottom-nav .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-width: 0;
      height: 100%;
      color: rgba(255, 255, 255, 0.48);
      text-decoration: none;
      font-size: 11px;
      line-height: 1.15;
      font-weight: 700;
      text-align: center;
    }

    .bottom-nav .nav-item i {
      font-size: 21px;
    }

    .bottom-nav .nav-item.active {
      color: var(--gc-gold-light);
    }

    .favorites-sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 88vw;
      max-width: 340px;
      height: 100vh;
      background: #151515;
      color: #fff;
      box-shadow: 2px 0 18px rgba(0, 0, 0, 0.35);
      padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 16px;
      transform: translateX(-100%);
      opacity: 0;
      transition: transform 0.25s ease, opacity 0.25s ease;
      z-index: 2000;
      overflow-y: auto;
      display: none;
      border-top-right-radius: 18px;
      border-bottom-right-radius: 18px;
      border-right: 1px solid var(--gc-line);
    }

    .favorites-sidebar.open {
      display: block;
      transform: translateX(0);
      opacity: 1;
    }

    .favorites-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.48);
      display: none;
      z-index: 1500;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .favorites-overlay.show {
      display: block;
      opacity: 1;
    }

    @media (min-width: 860px) {
      .profile-portrait {
        right: calc((100vw - 760px) / 2 + 28px);
      }
    }

    @media (max-width: 520px) {
      .booking-card {
        padding: 86px 15px 18px;
        border-radius: 21px;
      }

      .profile-portrait {
        display: block;
        width: 88px;
        right: 22px;
        top: 18px;
      }

      .date-strip {
        grid-template-columns: repeat(7, 64px);
      }

      .time-slot {
        font-size: 15px;
      }

      .confirm-booking-btn {
        gap: 10px;
        font-size: 14px;
      }
    }
  </style>

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Giovanni Cerino">
</head>

<body class="booking-page">
  <div class="gc-header d-flex justify-content-between align-items-center">
    <div class="gc-header-title">
      <i class="bi bi-calendar-check"></i>
      <span>Prenota</span>
    </div>
    <div class="gc-actions">
      <button type="button" id="favoritesToggle" class="gc-action-btn" title="Preferiti"><i class="bi bi-star"></i></button>
      <button type="button" class="gc-action-btn" onclick="logout()" title="Logout"><i class="bi bi-box-arrow-right"></i></button>
    </div>
  </div>

  <main class="booking-shell">
    <div id="alertBox"></div>

    <div class="profile-portrait">
      <img id="heroBarberImg" src="/images/logo.jpg" alt="Barbiere selezionato">
    </div>

    <section class="booking-card">
      <div class="booking-step">
        <h3 class="step-label"><span>1.</span> Seleziona servizio</h3>
        <div class="premium-select-card">
          <div class="select-icon"><i class="bi bi-scissors"></i></div>
          <div class="select-copy">
            <strong id="serviceCardTitle">Scegli servizio</strong>
            <span id="serviceCardMeta">Durata e prezzo</span>
          </div>
          <i class="bi bi-chevron-down select-chevron"></i>
          <select id="serviceSelect" aria-label="Servizio">
            <option value="">Seleziona servizio</option>
          </select>
        </div>
      </div>

      <div class="booking-step">
        <h3 class="step-label"><span>2.</span> Seleziona barbiere</h3>
        <div class="premium-select-card">
          <div id="barberAvatar" class="barber-avatar-large">
            <img id="barberAvatarImg" src="" alt="Avatar barbiere">
          </div>
          <div class="select-copy">
            <strong id="barberCardTitle">Scegli barbiere</strong>
            <span id="barberCardMeta">Giovanni Cerino Hair Stylist</span>
          </div>
          <i class="bi bi-chevron-down select-chevron"></i>
          <select id="barberSelect" aria-label="Barbiere">
            <option value="">Seleziona barbiere</option>
          </select>
        </div>
      </div>

      <div class="booking-step">
        <h3 class="step-label"><span>3.</span> Scegli data</h3>
        <input type="date" class="native-date" id="dateSelect" min="">
        <div class="month-control">
          <select id="monthSelect" aria-label="Mese"></select>
        </div>
        <div class="date-strip" id="dateStrip" aria-label="Date disponibili"></div>
      </div>

      <div class="booking-step">
        <h3 class="step-label"><span>4.</span> Scegli orario</h3>
        <select id="timeSelect" aria-label="Ora">
          <option value="">Seleziona ora</option>
        </select>
        <div class="time-grid" id="timeGrid">
          <p class="time-empty">Scegli servizio, barbiere e data.</p>
        </div>
      </div>

      <button id="confirmBtn" class="confirm-booking-btn" onclick="confirmBooking()">
        <i class="bi bi-calendar-check"></i>
        <span>Conferma prenotazione</span>
      </button>
    </section>
  </main>

  <nav class="bottom-nav">
    <a class="nav-item active">
      <i class="bi bi-calendar-check"></i>
      <span>Prenota</span>
    </a>
    <a href="my-bookings.html" class="nav-item">
      <i class="bi bi-card-list"></i>
      <span>Prenotazioni</span>
    </a>
    <a href="products.html" class="nav-item">
      <i class="bi bi-box-seam"></i>
      <span>Prodotti</span>
    </a>
  </nav>

  <script src="vender/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
  <script src="/js/config.js" defer></script>
  <script src="/js/auth.js" defer></script>
  <script src="/js/favorites-drawer.js" defer></script>
  <script src="/js/dashboard.js" defer></script>

  <div id="favoritesSidebar" class="favorites-sidebar">
    <div class="favorites-header d-flex justify-content-between align-items-center">
      <h6 class="mb-0">Preferiti</h6>
      <button class="btn btn-sm btn-outline-secondary" id="closeFavorites"><i class="bi bi-x"></i></button>
    </div>
    <p class="mt-2 mb-3 small text-muted">Questa e la tua lista di prodotti preferiti.</p>
    <div id="favoritesList" class="mt-3 small"></div>
  </div>
  <div id="favoritesOverlay" class="favorites-overlay"></div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js').then((registration) => {
        console.log('Service Worker registrato:', registration);
      }).catch((error) => {
        console.log('Service Worker registrazione fallita:', error);
      });
    }

    document.addEventListener('DOMContentLoaded', function() {
      const user = getUser();
      if (user && user.name) {
        document.getElementById('welcomeName').textContent = user.name;
      }
    });
  </script>
</body>
</html>
