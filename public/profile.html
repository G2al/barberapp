<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Profilo - Giovanni Cerino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vender/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app-ui.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <meta name="theme-color" content="#0b0b0e">

  <style>
    :root {
      --app-bg: #0b0b0e;
      --app-surface: #1b1b1d;
      --app-line: rgba(255, 255, 255, 0.12);
      --app-text: #fff;
      --app-muted: #aaa7a0;
      --app-gold: #f1b954;
      --app-gold-strong: #ffcd6b;
      --app-dark-text: #17150e;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: #08080a;
    }

    body.profile-page,
    body.profile-page button,
    body.profile-page input {
      font-family: "Poppins", Arial, sans-serif;
      letter-spacing: 0;
    }

    body.profile-page {
      min-height: 100vh;
      margin: 0;
      background: #08080a;
      color: var(--app-text);
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .app-shell {
      width: min(100%, 480px);
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px));
      background: var(--app-bg);
      box-shadow: 0 0 64px rgba(0, 0, 0, 0.5);
    }

    .profile-header {
      padding: calc(54px + env(safe-area-inset-top, 0px)) 22px 0;
      text-align: center;
    }

    .avatar-control {
      position: relative;
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      overflow: visible;
      border: 3px solid var(--app-gold);
      border-radius: 50%;
      background: #302f2d;
      color: #a9a59d;
      font-size: 46px;
    }

    .avatar-control img {
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 50%;
      object-fit: cover;
    }

    .avatar-add {
      position: absolute;
      right: 0;
      bottom: 3px;
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--app-bg);
      border-radius: 50%;
      background: var(--app-gold);
      color: var(--app-dark-text);
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .avatar-add input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .profile-name {
      margin: 19px 0 0;
      color: #fff;
      font-size: 20px;
      line-height: 1.25;
      font-weight: 700;
    }

    .profile-email {
      margin: 17px 0 0;
      color: #c1aa91;
      font-size: 12px;
    }

    .profile-content {
      padding: 28px 22px 24px;
    }

    .loyalty-card {
      width: 100%;
      display: block;
      padding: 22px;
      border: 1px solid rgba(241, 185, 84, 0.34);
      border-radius: 8px;
      background: linear-gradient(135deg, #3a2812, #261b0d);
      color: #fff;
      text-decoration: none;
      text-align: left;
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.25);
      cursor: pointer;
    }

    .loyalty-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .loyalty-card-title {
      color: var(--app-gold-strong);
      font-size: 14px;
      font-weight: 700;
    }

    .tier-badge {
      min-width: 62px;
      min-height: 27px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      border-radius: 7px;
      background: var(--app-gold);
      color: var(--app-dark-text);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .points-line {
      display: flex;
      align-items: baseline;
      gap: 7px;
      margin-top: 25px;
    }

    .points-value {
      color: #fff;
      font-size: 28px;
      line-height: 1;
      font-weight: 700;
    }

    .points-unit {
      color: #fff;
      font-size: 12px;
    }

    .tier-progress {
      height: 8px;
      overflow: hidden;
      margin-top: 25px;
      border-radius: 5px;
      background: rgba(0, 0, 0, 0.28);
    }

    .tier-progress span {
      width: 0;
      height: 100%;
      display: block;
      border-radius: inherit;
      background: linear-gradient(90deg, #ffd784, #e8a93c);
      transition: width 360ms ease;
    }

    .tier-caption {
      margin: 15px 0 0;
      color: #c7ab8f;
      font-size: 10px;
    }

    .details-section {
      margin-top: 28px;
    }

    .section-title {
      margin: 0 0 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }

    .profile-fields {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .profile-field {
      min-height: 70px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 40px;
      align-items: center;
      padding: 11px 10px 11px 18px;
      border: 1px solid var(--app-line);
      border-radius: 8px;
      background: var(--app-surface);
    }

    .field-copy {
      min-width: 0;
    }

    .field-label {
      display: block;
      margin-bottom: 3px;
      color: #a69c8d;
      font-size: 10px;
    }

    .field-value {
      display: block;
      overflow: hidden;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .edit-field {
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      color: var(--app-gold);
      font-size: 16px;
    }

    .password-action {
      width: 100%;
      min-height: 60px;
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) 20px;
      align-items: center;
      gap: 8px;
      margin-top: 26px;
      padding: 0 17px;
      border: 1px solid var(--app-line);
      border-radius: 8px;
      background: var(--app-surface);
      color: #fff;
      text-align: left;
    }

    .password-action .bi-lock {
      color: var(--app-gold);
    }

    .password-action span {
      font-size: 13px;
      font-weight: 500;
    }

    .password-action .bi-chevron-right {
      color: #77736c;
      font-size: 12px;
    }

    .sheet-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      visibility: hidden;
      background: rgba(0, 0, 0, 0.7);
      opacity: 0;
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    .sheet-overlay.open {
      visibility: visible;
      opacity: 1;
    }

    .edit-sheet {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 110;
      width: min(100%, 480px);
      padding: 21px 22px calc(25px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--app-line);
      border-radius: 12px 12px 0 0;
      background: #151517;
      box-shadow: 0 -18px 50px rgba(0, 0, 0, 0.55);
      transform: translate(-50%, 100%);
      transition: transform 220ms ease;
    }

    .edit-sheet.open {
      transform: translate(-50%, 0);
    }

    .loyalty-overlay {
      position: fixed;
      inset: 0;
      z-index: 140;
      visibility: hidden;
      background: rgba(0, 0, 0, 0.76);
      opacity: 0;
      transition: opacity 200ms ease, visibility 200ms ease;
    }

    .loyalty-overlay.open {
      visibility: visible;
      opacity: 1;
    }

    .loyalty-sheet {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 150;
      width: min(100%, 480px);
      height: min(92vh, 820px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--app-line);
      border-bottom: 0;
      border-radius: 14px 14px 0 0;
      background: #101012;
      box-shadow: 0 -24px 70px rgba(0, 0, 0, 0.7);
      transform: translate(-50%, 102%);
      transition: transform 240ms ease;
    }

    .loyalty-sheet.open {
      transform: translate(-50%, 0);
    }

    .loyalty-sheet-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--app-line);
      background: rgba(16, 16, 18, 0.98);
    }

    .loyalty-sheet-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
    }

    .loyalty-sheet-title i,
    .loyalty-section-title i {
      color: var(--app-gold);
    }

    .loyalty-sheet-close {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--app-line);
      border-radius: 50%;
      background: #232325;
      color: #fff;
      font-size: 16px;
    }

    .loyalty-sheet-content {
      flex: 1 1 auto;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 18px 18px calc(28px + env(safe-area-inset-bottom, 0px));
    }

    .loyalty-summary-card {
      padding: 20px;
      border: 1px solid rgba(241, 185, 84, 0.34);
      border-radius: 8px;
      background: linear-gradient(135deg, #3a2812, #20170c);
    }

    .loyalty-summary-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .loyalty-detail-label {
      display: block;
      color: #c9ad8d;
      font-size: 10px;
      font-weight: 500;
    }

    .loyalty-detail-balance {
      display: block;
      margin-top: 4px;
      color: #fff;
      font-size: 38px;
      line-height: 1;
      font-weight: 700;
    }

    .loyalty-reward-count {
      min-width: 72px;
      padding: 8px 10px;
      border-radius: 7px;
      background: var(--app-gold);
      color: var(--app-dark-text);
      font-size: 10px;
      font-weight: 700;
      text-align: center;
    }

    .loyalty-main-progress,
    .loyalty-rule-progress {
      overflow: hidden;
      border-radius: 5px;
      background: rgba(0, 0, 0, 0.3);
    }

    .loyalty-main-progress {
      height: 8px;
      margin-top: 17px;
    }

    .loyalty-main-progress span,
    .loyalty-rule-progress span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ffd784, #e8a93c);
      transition: width 360ms ease;
    }

    .loyalty-progress-copy {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 9px;
      color: #c9ad8d;
      font-size: 9px;
    }

    .loyalty-section {
      margin-top: 22px;
    }

    .loyalty-section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 11px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
    }

    .loyalty-list {
      display: grid;
      gap: 9px;
    }

    .loyalty-empty {
      margin: 0;
      padding: 17px;
      border: 1px solid var(--app-line);
      border-radius: 8px;
      background: var(--app-surface);
      color: var(--app-muted);
      font-size: 10px;
      text-align: center;
    }

    .loyalty-reward,
    .loyalty-rule,
    .loyalty-transaction {
      border: 1px solid var(--app-line);
      border-radius: 8px;
      background: var(--app-surface);
    }

    .loyalty-reward,
    .loyalty-rule {
      padding: 14px;
    }

    .loyalty-item-top,
    .loyalty-reward-bottom {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .loyalty-item-title {
      margin: 0;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
    }

    .loyalty-item-copy {
      margin: 4px 0 0;
      color: var(--app-muted);
      font-size: 9px;
    }

    .loyalty-code {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      color: var(--app-gold-strong);
      font-size: 10px;
      font-weight: 600;
    }

    .loyalty-reward-bottom {
      align-items: center;
      margin-top: 12px;
    }

    .loyalty-redeem {
      min-height: 34px;
      padding: 0 14px;
      border: 0;
      border-radius: 6px;
      background: var(--app-gold);
      color: var(--app-dark-text);
      font-size: 10px;
      font-weight: 600;
    }

    .loyalty-rule-value {
      flex: 0 0 auto;
      color: var(--app-gold);
      font-size: 10px;
      font-weight: 600;
    }

    .loyalty-rule-progress {
      height: 6px;
      margin-top: 11px;
    }

    .loyalty-transaction {
      min-height: 60px;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
    }

    .loyalty-transaction-icon {
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      background: #29282a;
      color: var(--app-gold);
    }

    .loyalty-points {
      color: #6ed89c;
      font-size: 11px;
      font-weight: 600;
    }

    .loyalty-points.negative {
      color: #ef7468;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .sheet-header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .sheet-close {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--app-line);
      border-radius: 50%;
      background: #232325;
      color: #fff;
      font-size: 17px;
    }

    .sheet-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sheet-field span {
      display: block;
      margin-bottom: 6px;
      color: #b4aea5;
      font-size: 10px;
      font-weight: 500;
    }

    .sheet-field input {
      width: 100%;
      height: 50px;
      border: 1px solid var(--app-line);
      border-radius: 7px;
      outline: 0;
      background: #242426;
      color: #fff;
      padding: 0 13px;
      font-size: 12px;
    }

    .sheet-field input:focus {
      border-color: var(--app-gold);
      box-shadow: 0 0 0 3px rgba(241, 185, 84, 0.1);
    }

    .sheet-error {
      min-height: 17px;
      margin: 0;
      color: #ef7468;
      font-size: 10px;
    }

    .sheet-submit {
      min-height: 50px;
      border: 0;
      border-radius: 7px;
      background: var(--app-gold);
      color: var(--app-dark-text);
      font-size: 12px;
      font-weight: 600;
    }

    .feedback-toast {
      position: fixed;
      left: 50%;
      bottom: calc(78px + env(safe-area-inset-bottom, 0px));
      z-index: 130;
      width: max-content;
      max-width: min(88vw, 380px);
      visibility: hidden;
      padding: 10px 14px;
      border: 1px solid rgba(241, 185, 84, 0.34);
      border-radius: 7px;
      background: #222224;
      color: #fff;
      font-size: 10px;
      text-align: center;
      opacity: 0;
      transform: translate(-50%, 10px);
      transition: opacity 160ms ease, transform 160ms ease, visibility 160ms ease;
    }

    .feedback-toast.show {
      visibility: visible;
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .bottom-nav {
      position: fixed;
      left: 50% !important;
      right: auto !important;
      bottom: 0;
      z-index: 50;
      width: min(100%, 480px);
      height: calc(64px + env(safe-area-inset-bottom, 0px));
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      margin: 0 !important;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 0 !important;
      background: rgba(15, 15, 17, 0.99);
      box-shadow: 0 -12px 30px rgba(0, 0, 0, 0.3);
      transform: translateX(-50%) !important;
      backdrop-filter: blur(16px);
    }

    .bottom-nav .nav-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c8c8ca;
      text-decoration: none;
      font-size: 23px;
    }

    .bottom-nav .nav-item.active {
      color: var(--app-gold);
    }

    .bottom-nav .nav-item.active::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 7px;
      width: 26px;
      height: 2px;
      border-radius: 2px;
      background: var(--app-gold);
      transform: translateX(-50%);
    }

    @media (max-width: 370px) {
      .profile-header {
        padding-top: calc(38px + env(safe-area-inset-top, 0px));
      }

      .profile-content {
        padding-inline: 16px;
      }

      .loyalty-card {
        padding: 19px;
      }
    }
  </style>
</head>

<body class="profile-page">
  <div class="app-shell">
    <header class="profile-header">
      <div id="avatarControl" class="avatar-control">
        <i id="avatarFallback" class="bi bi-person"></i>
        <img id="avatarImage" alt="Foto profilo" hidden>
        <label class="avatar-add" aria-label="Cambia foto profilo" title="Cambia foto profilo">
          <i class="bi bi-plus"></i>
          <input id="avatarInput" type="file" accept="image/jpeg,image/png,image/webp">
        </label>
      </div>
      <h1 id="profileName" class="profile-name">Caricamento...</h1>
      <p id="profileEmail" class="profile-email"></p>
    </header>

    <main class="profile-content">
      <button type="button" id="openLoyalty" class="loyalty-card" aria-label="Apri i dettagli della fidelity card">
        <div class="loyalty-card-top">
          <span class="loyalty-card-title">Fidelity Card</span>
          <span id="tierBadge" class="tier-badge">Bronze</span>
        </div>
        <div class="points-line">
          <strong id="pointsValue" class="points-value">0</strong>
          <span class="points-unit">punti</span>
        </div>
        <div class="tier-progress"><span id="tierProgress"></span></div>
        <p id="tierCaption" class="tier-caption">Caricamento livello...</p>
      </button>

      <section class="details-section">
        <h2 class="section-title">Dati personali</h2>
        <div class="profile-fields">
          <div class="profile-field">
            <div class="field-copy">
              <span class="field-label">Nome</span>
              <strong id="nameValue" class="field-value">-</strong>
            </div>
            <button type="button" class="edit-field" data-edit-field="name" aria-label="Modifica nome">
              <i class="bi bi-pencil"></i>
            </button>
          </div>

          <div class="profile-field">
            <div class="field-copy">
              <span class="field-label">Cognome</span>
              <strong id="surnameValue" class="field-value">-</strong>
            </div>
            <button type="button" class="edit-field" data-edit-field="surname" aria-label="Modifica cognome">
              <i class="bi bi-pencil"></i>
            </button>
          </div>

          <div class="profile-field">
            <div class="field-copy">
              <span class="field-label">Email</span>
              <strong id="emailValue" class="field-value">-</strong>
            </div>
            <button type="button" class="edit-field" data-edit-field="email" aria-label="Modifica email">
              <i class="bi bi-pencil"></i>
            </button>
          </div>

          <div class="profile-field">
            <div class="field-copy">
              <span class="field-label">Numero di telefono</span>
              <strong id="phoneValue" class="field-value">-</strong>
            </div>
            <button type="button" class="edit-field" data-edit-field="phone" aria-label="Modifica telefono">
              <i class="bi bi-pencil"></i>
            </button>
          </div>
        </div>
      </section>

      <button type="button" id="changePassword" class="password-action">
        <i class="bi bi-lock"></i>
        <span>Cambia password</span>
        <i class="bi bi-chevron-right"></i>
      </button>
    </main>
  </div>

  <div id="sheetOverlay" class="sheet-overlay"></div>
  <section id="editSheet" class="edit-sheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 id="sheetTitle">Modifica profilo</h2>
      <button type="button" id="closeSheet" class="sheet-close" aria-label="Chiudi">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
    <form id="sheetForm" class="sheet-form"></form>
  </section>

  <div id="loyaltyOverlay" class="loyalty-overlay"></div>
  <section id="loyaltySheet" class="loyalty-sheet" aria-hidden="true">
    <header class="loyalty-sheet-header">
      <h2 class="loyalty-sheet-title"><i class="bi bi-stars"></i> Fidelity Card</h2>
