<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Recupera password - Giovanni Cerino</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="vender/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app-ui.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <meta name="theme-color" content="#111111">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Giovanni Cerino">
    <style>
        :root {
            --auth-bg: #080808;
            --auth-field: rgba(55, 61, 72, 0.78);
            --auth-muted: rgba(255, 255, 255, 0.64);
            --auth-gold: #d5a13d;
            --auth-gold-light: #f0cd6d;
        }

        body.auth-page,
        body.auth-page input,
        body.auth-page button,
        body.auth-page a {
            font-family: "Poppins", Arial, sans-serif !important;
        }

        body.auth-page {
            min-height: 100vh;
            margin: 0;
            background: var(--auth-bg);
            color: #fff;
        }

        .auth-screen {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            background:
                linear-gradient(180deg, rgba(0, 0, 0, 0.28) 0%, rgba(0, 0, 0, 0.82) 43%, #080808 72%),
                url("/images/bg-login.jpg") top center / cover no-repeat fixed;
        }

        .auth-shell {
            width: min(100%, 480px);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(28px + env(safe-area-inset-bottom, 0px));
        }

        .back-btn {
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            background: transparent;
            color: #fff;
            font-size: 28px;
            text-decoration: none;
        }

        .auth-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 22px;
            padding: 18vh 0 40px;
        }

        .auth-title h1 {
            margin: 0;
            max-width: 400px;
            font-size: clamp(36px, 9vw, 48px);
            line-height: 1.05;
            font-weight: 600;
            letter-spacing: 0;
            color: #fff;
        }

        .auth-title p {
            margin: 14px 0 0;
            max-width: 390px;
            color: var(--auth-muted);
            font-size: 17px;
            line-height: 1.5;
            font-weight: 600;
        }

        .auth-form {
            display: grid;
            gap: 16px;
        }

        .auth-field {
            position: relative;
            min-height: 68px;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: var(--auth-field);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 12px 26px rgba(0, 0, 0, 0.24);
        }

        .field-icon {
            position: absolute;
            left: 22px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.58);
            font-size: 18px;
            pointer-events: none;
            z-index: 2;
        }

        .auth-field input {
            position: relative;
            z-index: 1;
            width: 100%;
            min-width: 0;
            min-height: 66px;
            border: 0;
            outline: 0;
            background: transparent;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            line-height: 1.5;
            padding: 0 26px 0 58px;
        }

        .auth-field input::placeholder {
            color: rgba(255, 255, 255, 0.58);
        }

        .auth-field input:-webkit-autofill,
        .auth-field input:-webkit-autofill:hover,
        .auth-field input:-webkit-autofill:focus,
        .auth-field input:-webkit-autofill:active {
            font-family: "Poppins", Arial, sans-serif !important;
            font-size: 17px !important;
            font-weight: 600 !important;
            line-height: 1.5 !important;
            -webkit-text-fill-color: #fff !important;
            caret-color: #fff;
            -webkit-box-shadow: 0 0 0 1000px #3b404a inset !important;
            box-shadow: 0 0 0 1000px #3b404a inset !important;
            transition: background-color 9999s ease-out 0s;
        }

        .auth-field input:-webkit-autofill::first-line {
            font-family: "Poppins", Arial, sans-serif !important;
            font-size: 17px !important;
            font-weight: 600 !important;
        }

        .auth-field:focus-within {
            border-color: rgba(240, 205, 109, 0.65);
            box-shadow: 0 0 0 3px rgba(213, 161, 61, 0.12), 0 12px 26px rgba(0, 0, 0, 0.24);
        }

        .auth-submit {
            min-height: 66px;
            border: 0;
            background: linear-gradient(135deg, var(--auth-gold), var(--auth-gold-light));
            color: #17100a;
            font-size: 18px;
            font-weight: 600;
            box-shadow: 0 20px 44px rgba(213, 161, 61, 0.24);
        }

        .auth-link,
        .support-copy {
            text-align: center;
            color: rgba(255, 255, 255, 0.78);
            font-size: 17px;
            font-weight: 750;
        }

        .auth-link a {
            color: var(--auth-gold-light);
            text-decoration: none;
        }

        .support-copy {
            margin: 4px auto 0;
            max-width: 390px;
            color: var(--auth-muted);
            font-size: 14px;
            line-height: 1.5;
            font-weight: 600;
        }

        #alertBox .alert {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0;
            font-weight: 700;
        }
    </style>
    <script src="/js/app-ui.js" defer></script>
    <script src="/js/config.js" defer></script>
    <script src="/js/auth.js" defer></script>
</head>

<body class="auth-page">
    <main class="auth-screen">
        <section class="auth-shell">
            <div>
                <a href="index.html" class="back-btn" aria-label="Torna alla pagina di accesso">
                    <i class="bi bi-arrow-left"></i>
                </a>
            </div>

            <div class="auth-content">
                <div class="auth-title">
                    <h1>Recupera password</h1>
                    <p>Inserisci l'indirizzo email del tuo account. Ti invieremo il collegamento per scegliere una nuova password.</p>
                </div>

                <div id="alertBox"></div>

                <div class="auth-form">
                    <label class="auth-field" for="email">
                        <i class="bi bi-envelope field-icon" aria-hidden="true"></i>
                        <input type="email" id="email" placeholder="Indirizzo email" autocomplete="email">
                    </label>

                    <button id="submitBtn" class="auth-submit" onclick="submitForgot()">Invia collegamento</button>
                </div>

                <div class="auth-link">
                    Ricordi la password? <a href="index.html">Accedi</a>
                </div>

                <p class="support-copy">
                    Per assistenza sul recupero dell'account, contatta direttamente Giovanni Cerino Hair Stylist.
                </p>
            </div>
        </section>
    </main>

    <script src="vender/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/service-worker.js").catch(() => null);
        }
    </script>
</body>

</html>
