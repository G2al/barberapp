<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Recupero password • Aletta Barber</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="vender/bootstrap/css/bootstrap.min.css">

    <!-- Custom -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Icons Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BarberApp">

    <!-- Config -->
    <script src="/js/config.js" defer></script>
    <!-- Auth Logic -->
    <script src="/js/auth.js" defer></script>
</head>

<body class="bg-light">
    <div class="auth-container">
        <div class="text-center mb-4">
            <div class="mb-3">
                <img src="/images/logo_barberia.png" alt="La Barberia Salvatore Nappa" class="app-logo-img">
            </div>
            <h4 class="fw-bold text-primary-color">Recupera password</h4>
            <p class="text-muted">Inserisci la tua email, ti invieremo il link</p>
        </div>

        <div id="alertBox"></div>

        <div class="auth-form">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0">
                        <i class="bi bi-envelope text-muted"></i>
                    </span>
                    <input type="email" class="form-control border-start-0" id="email" placeholder="Inserisci la tua email">
                </div>
            </div>

            <div class="d-grid gap-2 mb-3">
                <button id="submitBtn" class="btn btn-app" onclick="submitForgot()">Invia link</button>
            </div>

            <div class="text-center">
                <a href="index.html" class="text-primary-color text-decoration-none">Torna al login</a>
            </div>

            <div class="text-center mt-3 small text-muted">
                Non ricordi l'email?
                <a href="https://wa.me/393296430362?text=Ciao%2C%20ho%20dimenticato%20email%20e%20password%20di%20AlettaBarberApp." class="text-primary-color text-decoration-none">
                    Contattaci su WhatsApp
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap -->
    <script src="vender/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script>
    // Registra il Service Worker per PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js').catch((error) => {
            console.log('Service Worker registrazione fallita:', error);
        });
    }
    </script>
</body>

</html>
