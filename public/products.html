<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Prodotti - Giovanni Cerino</title>
  <link rel="stylesheet" href="vender/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <meta name="theme-color" content="#1a1a1a">
  <style>
    :root {
      --gc-bg: #090909;
      --gc-line: rgba(255, 255, 255, 0.09);
      --gc-muted: rgba(255, 255, 255, 0.62);
      --gc-gold: #d5a13d;
      --gc-gold-light: #f0cd6d;
    }

    body.gc-client-page {
      min-height: 100vh;
      padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px));
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0.96) 310px),
        url("/images/bg-login.jpg") top center / cover fixed no-repeat,
        #090909;
      color: #fff;
    }

    .gc-header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: calc(16px + env(safe-area-inset-top, 0px)) 18px 16px;
      background: rgba(9, 9, 9, 0.82);
      border-bottom: 1px solid var(--gc-line);
      backdrop-filter: blur(18px);
    }

    .gc-header h5 {
      font-size: 20px;
      font-weight: 900;
    }

    .gc-action-btn {
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      color: var(--gc-gold-light);
      text-decoration: none;
      padding: 0;
    }

    .content-area {
      max-width: 760px;
      margin: 0 auto;
      padding: 22px 14px 0 !important;
    }

    .products-hero,
    .input-group,
    #productsContainer .card {
      border: 1px solid var(--gc-line);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.035)),
        rgba(18, 18, 18, 0.88) !important;
      color: #fff;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.28) !important;
    }

    .input-group {
      border-radius: 16px;
      overflow: hidden;
    }

    .input-group .input-group-text,
    .input-group .form-control {
      background: transparent !important;
      border-color: transparent !important;
      color: #fff;
    }

    .input-group .form-control::placeholder,
    .text-muted {
      color: var(--gc-muted) !important;
    }

    .text-primary-color,
    #productsContainer h6 {
      color: #fff !important;
    }

    .cat-pill {
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.72);
      background: rgba(255, 255, 255, 0.055);
      font-weight: 700;
    }

    .cat-pill.active {
      background: linear-gradient(135deg, var(--gc-gold), var(--gc-gold-light));
      color: #fff;
      border-color: transparent;
    }

    .bottom-nav {
      position: fixed;
      left: 18px;
      right: 18px;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      z-index: 50;
      height: 72px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      max-width: 760px;
      margin: 0 auto;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.035)),
        rgba(22, 22, 22, 0.92);
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(18px);
    }

    .bottom-nav .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-width: 0;
      height: 100%;
      color: rgba(255, 255, 255, 0.48);
      text-decoration: none;
      font-size: 11px;
      line-height: 1.15;
      font-weight: 700;
      text-align: center;
    }

    .bottom-nav .nav-item i {
      font-size: 21px;
    }

    .bottom-nav .nav-item.active {
      color: var(--gc-gold-light);
    }

    .favorites-sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 88vw;
      max-width: 340px;
      height: 100vh;
      background: #151515;
      color: #fff;
      box-shadow: 2px 0 12px rgba(0,0,0,0.15);
      padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 16px 16px;
      transform: translateX(-100%);
      opacity: 0;
      transition: transform 0.25s ease, opacity 0.25s ease;
      z-index: 2000;
      overflow-y: auto;
      display: none;
      border-top-right-radius: 18px;
      border-bottom-right-radius: 18px;
      border-right: 1px solid var(--gc-line);
    }
    .favorites-sidebar.open {
      display: block;
      transform: translateX(0);
      opacity: 1;
    }
    .favorites-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      z-index: 1500;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .favorites-overlay.show {
      display: block;
      opacity: 1;
    }
    .favorites-header {
      padding-top: env(safe-area-inset-top, 0px);
    }
  </style>
</head>
<body class="gc-client-page">
  <div class="gc-header d-flex justify-content-between align-items-center">
    <h5 class="fw-bold text-white mb-0">Prodotti</h5>
    <div class="d-flex gap-2 align-items-center">
      <button id="favoritesToggle" class="gc-action-btn position-relative" title="Preferiti">
        <i class="bi bi-star"></i>
        <span id="favoritesCount" class="badge bg-warning text-dark position-absolute top-0 start-100 translate-middle rounded-pill" style="display:none;">0</span>
      </button>
      <button type="button" class="gc-action-btn" onclick="logout()" title="Logout"><i class="bi bi-box-arrow-right"></i></button>
    </div>
  </div>

  <div class="content-area p-3">
    <div class="products-hero rounded-4 p-3 mb-3 shadow-sm text-white" style="
    background-color: #141414;
">
      <div class="d-flex align-items-start">
        <div class="me-3">
          <div class="rounded-circle hero-icon d-flex align-items-center justify-content-center">
            <i class="bi bi-stars fs-5"></i>
          </div>
        </div>
        <div>
          <h6 class="mb-1">Scopri i prodotti del salone</h6>
          <p class="mb-0 small">Filtra per categoria e scorri le card per trovare ciò che ti serve.</p>
        </div>
      </div>
    </div>

    <div class="mb-3">
      <div class="input-group shadow-sm">
        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
        <input id="productSearch" type="text" class="form-control border-start-0" placeholder="Cerca prodotto...">
      </div>
    </div>

    <div id="categoryTabs" class="nav nav-pills small gap-2 mb-3 overflow-auto flex-nowrap"></div>

    <div id="productsContainer">
      <div class="text-center mt-5 text-muted" id="loadingMsg">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2">Caricamento prodotti...</p>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="dashboard.html" class="nav-item">
      <i class="bi bi-calendar-check"></i>
      <span>Prenota</span>
    </a>
    <a href="my-bookings.html" class="nav-item">
      <i class="bi bi-journal-text"></i>
      <span>Prenotazioni</span>
    </a>
    <a class="nav-item active">
      <i class="bi bi-box"></i>
      <span>Prodotti</span>
    </a>
  </div>

  <script src="vender/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js" defer></script>
  <script src="/js/auth.js" defer></script>
  <script src="/js/products.js" defer></script>

  <!-- Favorites sidebar -->
  <div id="favoritesSidebar" class="favorites-sidebar">
    <div class="favorites-header d-flex justify-content-between align-items-center">
      <h6 class="mb-0">Preferiti</h6>
      <button class="btn btn-sm btn-outline-secondary" id="closeFavorites"><i class="bi bi-x"></i></button>
    </div>
    <p class="mt-2 mb-3 small text-muted">Questa è la tua lista di prodotti preferiti. Mostrala in salone per richiederli al team.</p>
    <div id="favoritesList" class="mt-3 small"></div>
  </div>
  <div id="favoritesOverlay" class="favorites-overlay"></div>
</body>
</html>
