<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Prodotti - Aletta Barber</title>
  <link rel="stylesheet" href="vender/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/push-notifications.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a1a1a">
  <style>
    .favorites-sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 88vw;
      max-width: 340px;
      height: 100vh;
      background: var(--surface);
      box-shadow: 2px 0 12px rgba(0,0,0,0.15);
      padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 16px 16px;
      transform: translateX(-100%);
      opacity: 0;
      transition: transform 0.25s ease, opacity 0.25s ease;
      z-index: 2000;
      overflow-y: auto;
      display: none;
      border-top-right-radius: 12px;
      border-bottom-right-radius: 12px;
    }
    .favorites-sidebar.open {
      display: block;
      transform: translateX(0);
      opacity: 1;
    }
    .favorites-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      z-index: 1500;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .favorites-overlay.show {
      display: block;
      opacity: 1;
    }
    .favorites-header {
      padding-top: env(safe-area-inset-top, 0px);
    }
  </style>
</head>
<body class="bg-light">
  <div class="app-header d-flex justify-content-between align-items-center">
    <h5 class="fw-bold text-white mb-0">Prodotti</h5>
    <div class="d-flex gap-2 align-items-center">
      <button id="favoritesToggle" class="btn header-btn position-relative" title="Preferiti">
        <i class="bi bi-star"></i>
        <span id="favoritesCount" class="badge bg-warning text-dark position-absolute top-0 start-100 translate-middle rounded-pill" style="display:none;">0</span>
      </button>
      <a href="dashboard.html" class="btn header-btn" title="Prenota">
        <i class="bi bi-arrow-left text-white"></i>
      </a>
    </div>
  </div>

  <div class="content-area p-3">
    <div class="products-hero rounded-4 p-3 mb-3 shadow-sm text-white" style="
    background-color: #141414;
">
      <div class="d-flex align-items-start">
        <div class="me-3">
          <div class="rounded-circle hero-icon d-flex align-items-center justify-content-center">
            <i class="bi bi-stars fs-5"></i>
          </div>
        </div>
        <div>
          <h6 class="mb-1">Scopri i prodotti del salone</h6>
          <p class="mb-0 small">Filtra per categoria e scorri le card per trovare ciò che ti serve.</p>
        </div>
      </div>
    </div>

    <div class="mb-3">
      <div class="input-group shadow-sm">
        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
        <input id="productSearch" type="text" class="form-control border-start-0" placeholder="Cerca prodotto...">
      </div>
    </div>

    <div id="categoryTabs" class="nav nav-pills small gap-2 mb-3 overflow-auto flex-nowrap"></div>

    <div id="productsContainer">
      <div class="text-center mt-5 text-muted" id="loadingMsg">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2">Caricamento prodotti...</p>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="dashboard.html" class="nav-item">
      <i class="bi bi-calendar-check"></i>
      <span>Prenota</span>
    </a>
    <a href="my-bookings.html" class="nav-item">
      <i class="bi bi-journal-text"></i>
      <span>Le mie prenotazioni</span>
    </a>
    <a class="nav-item active">
      <i class="bi bi-box"></i>
      <span>Prodotti</span>
    </a>
    <a href="#" class="nav-item" onclick="logout()">
      <i class="bi bi-box-arrow-right"></i>
      <span>Logout</span>
    </a>
  </div>

  <script src="vender/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js" defer></script>
  <script src="/js/auth.js" defer></script>
  <script src="/js/products.js" defer></script>
  <script src="/js/push-notifications.js" defer></script>

  <!-- Favorites sidebar -->
  <div id="favoritesSidebar" class="favorites-sidebar">
    <div class="favorites-header d-flex justify-content-between align-items-center">
      <h6 class="mb-0">Preferiti</h6>
      <button class="btn btn-sm btn-outline-secondary" id="closeFavorites"><i class="bi bi-x"></i></button>
    </div>
    <p class="mt-2 mb-3 small text-muted">Questa è la tua lista di prodotti preferiti. Mostrala in salone per richiederli al team.</p>
    <div id="favoritesList" class="mt-3 small"></div>
  </div>
  <div id="favoritesOverlay" class="favorites-overlay"></div>
</body>
</html>
