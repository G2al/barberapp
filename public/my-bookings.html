<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Le mie prenotazioni • BarberApp</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="vender/bootstrap/css/bootstrap.min.css">
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <!-- Custom -->
  <link rel="stylesheet" href="css/style.css">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BarberApp">
</head>

<body class="bg-light">

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="d-flex align-items-center mb-3">
        <div class="user-avatar me-3">
          <i class="bi bi-person"></i>
        </div>
        <div>
          <h6 id="usernameDisplay" class="mb-1">Utente</h6>
          <p class="mb-0 small">Cliente BarberApp</p>
        </div>
      </div>
      <div class="mt-3">
        <button class="btn btn-danger w-100 rounded-3" onclick="logout()">
          <i class="bi bi-box-arrow-right me-2"></i> Logout
        </button>
      </div>
    </div>
  </div>

  <!-- Overlay -->
  <div class="overlay" id="overlay"></div>

  <!-- Header -->
  <div class="app-header d-flex justify-content-between align-items-center bg-primary text-white">
    <div class="d-flex align-items-center">
      <i class="bi bi-journal-text me-2 app-header-icon"></i>
      <span class="app-header-title fw-bold">Le mie prenotazioni</span>
    </div>
    <div class="d-flex gap-2">
      <button class="btn header-btn text-white" onclick="refreshApp()" title="Aggiorna">
        <i class="bi bi-arrow-clockwise icon-md"></i>
      </button>
      <a href="profile.html" class="btn header-btn text-white">
        <i class="bi bi-person-circle icon-md"></i>
      </a>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="content-area">
    <div class="page-content">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="fw-semibold text-primary-color m-0">Prenotazioni recenti</h6>
      </div>

      <!-- Lista prenotazioni -->
      <div id="bookingsList" class="pb-5">
        <div class="text-center mt-5 text-muted" id="loadingMsg">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-2">Caricamento prenotazioni...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <a href="dashboard.html" class="nav-item">
      <i class="bi bi-calendar-check"></i>
      <span>Prenota</span>
    </a>
    <a class="nav-item active">
      <i class="bi bi-journal-text"></i>
      <span>Le mie prenotazioni</span>
    </a>
    <a href="#" class="nav-item" onclick="logout()">
      <i class="bi bi-box-arrow-right"></i>
      <span>Logout</span>
    </a>
  </div>

  <!-- Scripts -->
  <script src="vender/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      requireAuth();

      const token = localStorage.getItem("token");
      const bookingsList = document.getElementById("bookingsList");
      const loadingMsg = document.getElementById("loadingMsg");

      if (!token) {
        window.location.href = "login.html";
        return;
      }

      const statusTranslations = {
        pending: "In sospeso",
        confirmed: "Confermata",
        cancelled: "Annullata",
      };

      const badgeColors = {
        pending: "bg-warning text-dark",
        confirmed: "bg-success text-white",
        cancelled: "bg-danger text-white",
      };

      const formatDate = (dateString) => {
        try {
          const d = new Date(dateString);
          return d.toLocaleDateString("it-IT", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
          });
        } catch {
          return dateString;
        }
      };

      // ✅ Funzione per formattare l'orario (toglie i secondi)
      const formatTime = (timeString) => {
        if (!timeString) return "";
        return timeString.slice(0, 5); // da "10:30:00" -> "10:30"
      };

      try {
        const response = await fetch(`${API_BASE}/bookings`, {
          method: "GET",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Accept": "application/json",
          },
        });

        const data = await response.json();
        loadingMsg.style.display = "none";

        if (!data.status || !data.bookings.length) {
          bookingsList.innerHTML = `
            <div class="text-center text-muted mt-5">
              <i class="bi bi-calendar-x display-4 d-block mb-2"></i>
              <p>Nessuna prenotazione trovata.</p>
            </div>`;
          return;
        }

        data.bookings.forEach((booking) => {
          const translatedStatus = statusTranslations[booking.status] || booking.status;
          const badgeClass = badgeColors[booking.status] || "bg-secondary";
          const formattedDate = formatDate(booking.date);
          const formattedTime = formatTime(booking.time);

          const item = document.createElement("div");
          item.className = "list-item mb-3 p-3 bg-white rounded-3 shadow-sm";

          item.innerHTML = `
            <div class="d-flex justify-content-between align-items-start mb-2">
              <div>
                <div class="fw-semibold text-primary-color">${booking.service}</div>
                <div class="small text-muted">${booking.staff}</div>
              </div>
              <span class="badge ${badgeClass}">${translatedStatus}</span>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-2 mb-3">
              <div class="d-flex align-items-center">
                <i class="bi bi-calendar3 me-2 text-muted"></i>
                <span>${formattedDate}</span>
              </div>
              <div class="d-flex align-items-center">
                <i class="bi bi-clock me-2 text-muted"></i>
                <span>${formattedTime}</span>
              </div>
            </div>

            <div class="d-flex justify-content-center">
              <button class="btn action-btn secondary-action-btn flex-grow-1 contact-btn">
                <i class="bi bi-telephone-forward me-1"></i> Contatta il barbiere
              </button>
            </div>
          `;

          // Evento: clic su “Contatta il barbiere”
          const contactBtn = item.querySelector(".contact-btn");
          contactBtn.addEventListener("click", () => {
            if (booking.staff_phone) {
              const cleanPhone = booking.staff_phone.replace(/[^\d+]/g, '').trim();
              const phoneWithPrefix = cleanPhone.startsWith('+39') ? cleanPhone : `+39${cleanPhone}`;
              window.location.href = `tel:${phoneWithPrefix}`;
            } else {
              alert("Numero di telefono non disponibile per questo barbiere.");
            }
          });

          bookingsList.appendChild(item);
        });
      } catch (error) {
        console.error("Errore nel caricamento:", error);
        bookingsList.innerHTML = `
          <div class="text-center text-danger mt-5">
            <i class="bi bi-exclamation-triangle display-4 d-block mb-2"></i>
            <p>Errore durante il caricamento delle prenotazioni.</p>
          </div>`;
      }
    });

    // Registra il Service Worker per PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/js/service-worker.js').then((registration) => {
        console.log('Service Worker registrato:', registration);
      }).catch((error) => {
        console.log('Service Worker registrazione fallita:', error);
      });
    }
  </script>

</body>
</html>
