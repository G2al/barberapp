<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Le mie prenotazioni - Giovanni Cerino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vender/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app-ui.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <meta name="theme-color" content="#0b0b0e">

  <style>
    :root {
      --app-bg: #0b0b0e;
      --app-surface: #1b1b1d;
      --app-surface-soft: #242426;
      --app-line: rgba(255, 255, 255, 0.12);
      --app-text: #fff;
      --app-muted: #aaa7a0;
      --app-gold: #ffd558;
      --app-gold-strong: #ffda32;
      --app-danger: #ef7468;
      --app-success: #64d68b;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: #08080a;
    }

    body.bookings-page,
    body.bookings-page button,
    body.bookings-page input,
    body.bookings-page select {
      font-family: "Poppins", Arial, sans-serif;
      letter-spacing: 0;
    }

    body.bookings-page {
      min-height: 100vh;
      margin: 0;
      background: #08080a;
      color: var(--app-text);
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .app-shell {
      width: min(100%, 480px);
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
      background: var(--app-bg);
      box-shadow: 0 0 64px rgba(0, 0, 0, 0.5);
    }

    .home-header {
      position: relative;
      min-height: 138px;
      background:
        linear-gradient(90deg, rgba(10, 9, 13, 0.28), rgba(13, 15, 20, 0.68)),
        linear-gradient(180deg, rgba(0, 0, 0, 0.06), rgba(11, 11, 14, 0.18)),
        url("/images/bg-login.jpg") center 42% / cover no-repeat;
    }

    .header-inner {
      min-height: 138px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding: calc(18px + env(safe-area-inset-top, 0px)) 22px 18px;
    }

    .greeting-copy {
      min-width: 0;
    }

    .greeting-copy h1 {
      margin: 0;
      overflow: hidden;
      color: #fff;
      font-size: 25px;
      line-height: 1.1;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .location-line {
      display: flex;
      align-items: center;
      gap: 7px;
      max-width: 255px;
      margin-top: 7px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
    }

    .location-line i {
      flex-shrink: 0;
      color: var(--app-gold-strong);
      font-size: 15px;
    }

    .location-line span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-actions {
      position: relative;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    .header-action {
      position: relative;
      width: 43px;
      height: 43px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255, 218, 50, 0.82);
      border-radius: 50%;
      background: rgba(20, 20, 22, 0.62);
      color: #fff;
      font-size: 19px;
      backdrop-filter: blur(10px);
    }

    .header-action.notification::after {
      content: "";
      position: absolute;
      top: 6px;
      right: 6px;
      width: 7px;
      height: 7px;
      border: 1px solid #282828;
      border-radius: 50%;
      background: var(--app-gold-strong);
    }

    .header-popover {
      position: absolute;
      top: 53px;
      right: 0;
      z-index: 60;
      width: min(280px, calc(100vw - 40px));
      display: none;
      padding: 14px;
      border: 1px solid var(--app-line);
      border-radius: 8px;
      background: rgba(21, 21, 23, 0.99);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.52);
    }

    .header-popover.open {
      display: block;
    }

    .header-popover strong {
      display: block;
      font-size: 13px;
      font-weight: 600;
    }

    .header-popover p {
      margin: 4px 0 0;
      overflow: hidden;
      color: var(--app-muted);
      font-size: 11px;
      text-overflow: ellipsis;
    }

    .profile-logout {
      width: 100%;
      min-height: 38px;
      margin-top: 11px;
      border: 1px solid var(--app-line);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
    }

    .bookings-content {
      padding: 24px 22px 20px;
    }

    .page-title {
      margin: 0 0 20px;
      color: #fff;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 700;
    }

    .search-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 54px;
      gap: 10px;
      margin-bottom: 16px;
    }

    .search-field {
      position: relative;
    }

    .search-field i {
      position: absolute;
      top: 50%;
      left: 15px;
      color: var(--app-muted);
      font-size: 15px;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .search-field input {
      width: 100%;
      height: 54px;
      border: 1px solid var(--app-line);
      border-radius: 8px;
      outline: 0;
      background: #1a1a1c;
      color: #fff;
      padding: 0 14px 0 43px;
      font-size: 12px;
    }

    .search-field input::placeholder {
      color: #948f84;
    }

    .search-field input:focus {
      border-color: var(--app-gold-strong);
      box-shadow: 0 0 0 3px rgba(255, 218, 50, 0.1);
    }

    .filter-button {
      position: relative;
      width: 54px;
      height: 54px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--app-gold-strong);
      border-radius: 8px;
      background: #131315;
      color: var(--app-gold-strong);
      font-size: 18px;
    }

    .filter-button.has-filters::after {
      content: "";
      position: absolute;
      top: 8px;
      right: 8px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--app-gold-strong);
    }

    .status-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 18px;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .status-tabs::-webkit-scrollbar {
      display: none;
    }

    .status-tab {
      flex: 0 0 auto;
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid var(--app-line);
      border-radius: 20px;
      background: #19191b;
      color: #ddd;
      font-size: 10px;
      font-weight: 600;
    }

    .status-tab.active {
      border-color: var(--app-gold-strong);
      background: var(--app-gold-strong);
      color: #17150e;
    }

    .bookings-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .booking-card {
      padding: 14px;
      border: 1px solid var(--app-line);
      border-radius: 8px;
      background: #1a1a1c;
    }

    .booking-card-top {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
    }

    .staff-avatar {
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(255, 218, 50, 0.44);
      border-radius: 50%;
      background: #29292b;
      color: var(--app-gold-strong);
      font-size: 16px;
      font-weight: 600;
    }

    .staff-avatar img {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      object-fit: cover;
    }

    .booking-main {
      min-width: 0;
    }

    .booking-staff {
      overflow: hidden;
      margin: 0;
      color: #b8ae9d;
      font-size: 10px;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .booking-staff-line {
      min-width: 0;
      display: flex;
      align-items: center;
      margin-bottom: 3px;
    }

    .booking-service {
      min-width: 0;
      overflow: hidden;
      margin: 0;
      color: #fff;
      font-size: 14px;
      line-height: 1.25;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .booking-service-line {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .booking-datetime {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px 11px;
      margin-top: 7px;
      color: #eee9df;
      font-size: 10px;
      font-weight: 500;
    }

    .booking-datetime span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .booking-datetime i {
      color: var(--app-gold-strong);
      font-size: 11px;
    }

    .booking-duration {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 5px;
      color: #e4dfd5;
      font-size: 10px;
    }

    .booking-duration i {
      color: var(--app-gold-strong);
    }

    .booking-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 6px;
    }

    .booking-meta .booking-duration {
      margin-top: 0;
    }

    .card-actions {
      display: flex;
      gap: 7px;
    }

    .card-action {
      width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 15px;
    }

    .call-action {
      border: 0;
      background: var(--app-gold-strong);
      color: #17150e;
      text-decoration: none;
    }

    .call-action.disabled {
      pointer-events: none;
      filter: grayscale(1);
      opacity: 0.45;
    }

    .cancel-action {
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid rgba(239, 116, 104, 0.28);
      border-radius: 50%;
      background: #242321;
      color: var(--app-danger);
      font-size: 15px;
    }

    .status-badge {
      min-height: 22px;
      display: inline-flex;
      align-items: center;
      padding: 0 8px;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 600;
    }

    .status-pending,
    .status-confirmed {
      background: rgba(255, 218, 50, 0.14);
      color: var(--app-gold);
    }

    .status-completed {
      background: rgba(100, 214, 139, 0.14);
      color: var(--app-success);
    }

    .status-cancelled,
    .status-no_show {
      background: rgba(239, 116, 104, 0.14);
      color: var(--app-danger);
    }

    .booking-note {
      margin: 12px 0 0;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      color: #bbb7af;
      font-size: 9px;
      line-height: 1.45;
    }

    .list-message {
      padding: 38px 20px;
      color: var(--app-muted);
      text-align: center;
      font-size: 11px;
    }

    .list-message i {
      display: block;
      margin-bottom: 9px;
      color: var(--app-gold-strong);
      font-size: 30px;
    }

    .filter-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      visibility: hidden;
      background: rgba(0, 0, 0, 0.66);
      opacity: 0;
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    .filter-overlay.open {
      visibility: visible;
      opacity: 1;
    }

    .filter-drawer {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 110;
      width: min(88vw, 350px);
      height: 100dvh;
      overflow-y: auto;
      padding: calc(20px + env(safe-area-inset-top, 0px)) 18px 24px;
      border-left: 1px solid var(--app-line);
      background: #111113;
      box-shadow: -20px 0 50px rgba(0, 0, 0, 0.58);
      transform: translateX(100%);
      transition: transform 220ms ease;
    }

    .filter-drawer.open {
      transform: translateX(0);
    }

    .filter-drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .filter-drawer-header h2 {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
    }

    .drawer-close {
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--app-line);
      border-radius: 50%;
      background: #202022;
      color: #fff;
      font-size: 18px;
    }

    .filter-field {
      display: block;
      margin-bottom: 17px;
    }

    .filter-field span {
      display: block;
      margin-bottom: 7px;
      color: #ddd;
      font-size: 11px;
      font-weight: 600;
    }

    .filter-field select,
    .filter-field input {
      width: 100%;
      height: 48px;
      border: 1px solid var(--app-line);
      border-radius: 7px;
      outline: 0;
      background: #242426;
      color: #fff;
      padding: 0 12px;
      color-scheme: dark;
      font-size: 11px;
    }

    .filter-field select:focus,
    .filter-field input:focus {
      border-color: var(--app-gold-strong);
    }

    .drawer-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 25px;
    }

    .drawer-action {
      min-height: 48px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 600;
    }

    .reset-filters {
      border: 1px solid var(--app-line);
      background: #242426;
      color: #fff;
    }

    .apply-filters {
      border: 0;
      background: var(--app-gold-strong);
      color: #17150e;
    }

    .bottom-nav {
      position: fixed;
      left: 50% !important;
      right: auto !important;
      bottom: 0;
      z-index: 50;
      width: min(100%, 480px);
      height: calc(64px + env(safe-area-inset-bottom, 0px));
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      margin: 0 !important;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 0 !important;
      background: rgba(15, 15, 17, 0.99);
      box-shadow: 0 -12px 30px rgba(0, 0, 0, 0.3);
      transform: translateX(-50%) !important;
      backdrop-filter: blur(16px);
    }

    .bottom-nav .nav-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c8c8ca;
      text-decoration: none;
      font-size: 23px;
    }

    .bottom-nav .nav-item.active {
      color: var(--app-gold-strong);
    }

    .bottom-nav .nav-item.active::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 7px;
      width: 26px;
      height: 2px;
      border-radius: 2px;
      background: var(--app-gold-strong);
      transform: translateX(-50%);
    }

    @media (max-width: 370px) {
      .bookings-content {
        padding-inline: 16px;
      }

      .booking-card {
        padding: 12px;
      }

      .booking-card-top {
        grid-template-columns: 52px minmax(0, 1fr) auto;
        gap: 9px;
      }

      .staff-avatar {
        width: 52px;
        height: 52px;
      }

      .card-action {
        width: 36px;
        height: 36px;
      }

      .cancel-action {
        width: 36px;
        height: 36px;
      }
    }
  </style>
</head>

<body class="bookings-page">
  <div class="app-shell">
    <header class="home-header">
      <div class="header-inner">
        <div class="greeting-copy">
          <h1>Ciao <span id="welcomeName">cliente</span>,</h1>
          <div class="location-line">
            <i class="bi bi-geo-alt"></i>
            <span id="shopLocation">Caricamento posizione...</span>
          </div>
        </div>

        <div class="header-actions">
          <button type="button" id="notificationButton" class="header-action notification" aria-label="Notifiche" aria-expanded="false">
            <i class="bi bi-bell-fill"></i>
          </button>
          <button type="button" id="logoutButton" class="header-action logout-action" aria-label="Esci dall'account" title="Esci dall'account">
            <i class="bi bi-box-arrow-right"></i>
          </button>

          <div id="notificationPanel" class="header-popover">
            <strong>Notifiche</strong>
            <p>Qui trovi tutti gli aggiornamenti sui tuoi appuntamenti.</p>
          </div>

        </div>
      </div>
    </header>

    <main class="bookings-content">
      <h2 class="page-title">Le mie prenotazioni</h2>

      <div class="search-row">
        <label class="search-field">
          <i class="bi bi-search"></i>
          <input id="bookingSearch" type="search" placeholder="Cerca per servizio..." autocomplete="off">
        </label>
        <button type="button" id="openFilters" class="filter-button" aria-label="Apri filtri" aria-expanded="false">
          <i class="bi bi-funnel"></i>
        </button>
      </div>

      <div id="statusTabs" class="status-tabs" aria-label="Filtra per stato">
        <button type="button" class="status-tab" data-status="all">Tutte</button>
        <button type="button" class="status-tab active" data-status="confirmed">Confermate</button>
        <button type="button" class="status-tab" data-status="completed">Completate</button>
        <button type="button" class="status-tab" data-status="cancelled">Annullate</button>
      </div>

      <div id="bookingsList" class="bookings-list">
        <div class="list-message">
          <span class="spinner-border spinner-border-sm" role="status"></span>
          <p class="mt-2 mb-0">Caricamento prenotazioni...</p>
        </div>
      </div>
    </main>
  </div>

  <div id="filterOverlay" class="filter-overlay"></div>
  <aside id="filterDrawer" class="filter-drawer" aria-hidden="true">
    <div class="filter-drawer-header">
      <h2>Filtra prenotazioni</h2>
      <button type="button" id="closeFilters" class="drawer-close" aria-label="Chiudi filtri">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <label class="filter-field">
      <span>Barbiere</span>
      <select id="staffFilter">
        <option value="">Tutto lo staff</option>
      </select>
    </label>

    <label class="filter-field">
      <span>Stato</span>
      <select id="statusFilter">
        <option value="">Tutti gli stati</option>
        <option value="pending">In sospeso</option>
        <option value="confirmed">Confermata</option>
        <option value="completed">Completata</option>
        <option value="cancelled">Annullata</option>
        <option value="no_show">Assente</option>
      </select>
    </label>

    <label class="filter-field">
      <span>Dal giorno</span>
      <input id="dateFromFilter" type="date">
    </label>

    <label class="filter-field">
      <span>Al giorno</span>
      <input id="dateToFilter" type="date">
    </label>

    <div class="drawer-actions">
      <button type="button" id="resetFilters" class="drawer-action reset-filters">Azzera</button>
      <button type="button" id="applyFilters" class="drawer-action apply-filters">Applica</button>
    </div>
  </aside>

  <nav class="bottom-nav" aria-label="Navigazione principale">
    <a href="dashboard.html" class="nav-item" aria-label="Prenota" title="Prenota">
      <i class="bi bi-scissors"></i>
    </a>
    <a href="my-bookings.html" class="nav-item active" aria-label="Le mie prenotazioni" title="Le mie prenotazioni">
      <i class="bi bi-calendar2-check"></i>
    </a>
    <a href="products.html" class="nav-item" aria-label="Prodotti" title="Prodotti">
      <i class="bi bi-bag"></i>
    </a>
    <a href="profile.html" class="nav-item" aria-label="Profilo" title="Profilo">
      <i class="bi bi-person"></i>
    </a>
  </nav>

  <script src="vender/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app-ui.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/my-bookings.js"></script>
</body>

</html>
