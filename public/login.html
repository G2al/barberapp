<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Accedi • BarberApp</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="vender/bootstrap/css/bootstrap.min.css">

    <!-- Custom -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Icons Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BarberApp">

    <!-- Config -->
    <script src="/js/config.js" defer></script>
    <!-- Auth Logic -->
    <script src="/js/auth.js" defer></script>
</head>

<body class="bg-light">

    <div class="auth-container">

        <!-- Logo -->
        <div class="text-center mb-4">
            <div class="mb-3">
                <img src="/images/logo.jpg" alt="BarberApp" class="app-logo-img">
            </div>
            <h4 class="fw-bold text-primary-color">BarberApp</h4>
            <p class="text-muted">Accedi al tuo account</p>
        </div>

        <!-- ALERT AREA -->
        <div id="alertBox"></div>

        <!-- Form -->
        <div class="auth-form">

            <!-- EMAIL -->
            <div class="mb-3">
                <label class="form-label">Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0">
                        <i class="bi bi-envelope text-muted"></i>
                    </span>
                    <input type="email" class="form-control border-start-0" id="email" placeholder="Inserisci la tua email">
                </div>
            </div>

            <!-- PASSWORD -->
            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0">
                        <i class="bi bi-lock text-muted"></i>
                    </span>

                    <input type="password" 
                        class="form-control border-start-0 border-end-0" 
                        id="password" 
                        placeholder="Inserisci la password">

                    <span class="input-group-text bg-transparent" 
                        style="cursor:pointer;"
                        onclick="togglePassword('password', 'toggleLoginPass')">
                        <i id="toggleLoginPass" class="bi bi-eye text-muted"></i>
                    </span>
                </div>
            </div>


            <!-- LOGIN BUTTON -->
            <div class="d-grid gap-2 mb-4">
                <button id="submitBtn" class="btn btn-app" onclick="submitLogin()">Accedi</button>
            </div>

            <!-- SIGN UP LINK -->
            <div class="text-center">
                <p class="mb-0">Non hai un account?
                    <a href="register.html" class="text-primary-color text-decoration-none">Registrati</a>
                </p>
            </div>

        </div>
    </div>

    <!-- Bootstrap -->
    <script src="vender/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script>
    function togglePassword(id, iconId) {
        const input = document.getElementById(id);
        const icon = document.getElementById(iconId);

        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("bi-eye");
            icon.classList.add("bi-eye-slash");
        } else {
            input.type = "password";
            icon.classList.remove("bi-eye-slash");
            icon.classList.add("bi-eye");
        }
    }

    // Registra il Service Worker per PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/js/service-worker.js').then((registration) => {
            console.log('Service Worker registrato:', registration);
        }).catch((error) => {
            console.log('Service Worker registrazione fallita:', error);
        });
    }
    </script>


</body>

</html>
